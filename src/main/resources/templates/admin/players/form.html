<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
	
<head th:replace="~{fragments/navbar :: head-fragment(${player.id == null} ? 'Aggiungi Giocatore' : 'Modifica Giocatore')}"></head>

<body>
	<nav th:replace="~{fragments/navbar :: main-nav}"></nav>

	<main class="container">
			<div class="form-input">
				<h1 th:text="${player.id == null} ? 'Inserisci giocatore' : 'Modifica giocatore'">Gestione giocatore</h1>

				<form th:action="${player.id == null} ? @{/admin/players} : @{/admin/players/{id}(id=${player.id})}"
					th:object="${player}" method="post">

					<div class="form-error-box" th:if="${#fields.hasGlobalErrors()}">
						<p class="error-text" th:each="err : ${#fields.globalErrors()}" th:text="${err}">
							Errore
						</p>
					</div>

					<div class="form-group">
						<div><label for="name">Nome</label></div>
						<input id="name" type="text" th:field="*{name}" required>
						<div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Errore</div>
					</div>

					<div class="form-group">
						<div><label for="surname">Cognome</label></div>
						<input id="surname" type="text" th:field="*{surname}" required>
						<div class="error" th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}">Errore</div>
					</div>

					<div class="form-group">
						<div><label for="dateOfBirth">Data di nascita</label></div>
						<input id="dateOfBirth" type="date" th:field="*{dateOfBirth}" required>
						<div class="error" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}">Errore
						</div>
					</div>

					<div class="form-group">
						<div><label for="role">Ruolo</label></div>
						<select id="role" th:field="*{role}" required>
							<option value="">-- Seleziona ruolo --</option>
							<option value="Portiere">Portiere</option>
							<option value="Difensore">Difensore</option>
							<option value="Centrocampista">Centrocampista</option>
							<option value="Attaccante">Attaccante</option>
						</select>
						<div class="error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}">Errore</div>
					</div>

					<div class="form-group">
						<div><label for="height">Altezza (cm)</label></div>
						<input id="height" type="number" th:field="*{height}" min="100" max="250" required>
						<div class="error" th:if="${#fields.hasErrors('height')}" th:errors="*{height}">Errore</div>
					</div>

					<div class="form-group">
						<div><label for="teamId">Squadra</label></div>
						<select id="teamId" name="teamId" class="form-control">
							<option value="">Nessuna squadra (Svincolato)</option>
							<option th:each="t : ${teams}" th:value="${t.id}" th:text="${t.name}"
								th:selected="${selectedTeamId != null and selectedTeamId == t.id}">
								Squadra
							</option>
						</select>
					</div>
			</div>

			<div class="inline-actions">
				<button type="submit" class="confirm-btn"
					th:text="${player.id != null} ? 'Aggiorna' : 'Salva'">Salva</button>
				<a href="javascript:history.back()" class="cancel-btn">Annulla</a>
			</div>
			</form>
	</main>
</body>

</html>
