<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Accedi</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<link rel="icon" th:href="@{/images/favicon.ico}" />
</head>

<body>
	<div class="logo-login-container">
		<a th:href="@{/}"><img th:src="@{/images/logo.png}" alt="PassioneCalcio logo" class="logo-login"></a>
	</div>
	<div class="auth-card">

		<h1>Accedi con il tuo account</h1>

		<p>Inserisci le tue credenziali per accedere al tuo account.</p>

		<p th:if="${param.error}" class="login-error">
			Username o password non validi.
		</p>

		<p th:if="${param.logout}">
			Logout effettuato correttamente.
		</p>

		<form th:action="@{/login}" method="post">
			<div class="form-group">
				<div><label for="username">Username</label></div>
				<input id="username" type="text" name="username" required>
			</div>

			<div class="form-group">
				<div><label for="password">Password</label></div>
				<input id="password" type="password" name="password" required>
			</div>

			<button class="login-btn" type="submit">Accedi</button>
		</form>

		<p style="margin-top: 16px;">
			Non hai un account?
			<a th:href="@{/register}">Registrati</a>
		</p>
	</div>
</body>

</html>
