spring.application.name=PassioneCalcio
#====== Datasource Configuration ======
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=trace
spring.jpa.hibernate.ddl-auto=create
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/passione_calcio
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true
#====== Web Server =======
server.port=8080
#====== Thymeleaf Configuration ======
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
#================================
# = Images
#================================
# Limite tecnico accettato dal server.
# Il limite applicativo di 5 MB viene controllato nel controller.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB